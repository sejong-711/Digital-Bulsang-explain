<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디지털 불상 컬렉션 — 상세 관람</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=KoPubWorld+Batang:wght@500;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="logo">디지털 불상 컬렉션</div>
    <ul class="nav-links">
      <li><a href="index.html">소개</a></li>
      <li><a href="list.html">전시 컬렉션</a></li>
    </ul>
  </nav>

  <main class="container">
    <div style="margin-bottom: 1.5rem;">
      <a href="list.html" style="color: var(--gold-primary); font-size: 0.9rem;">← 전체 목록으로 돌아가기</a>
    </div>

    <div class="detail-layout">
      <!-- 시각 뷰어 영역 (핫스팟 인터랙션) -->
      <div>
        <div class="viewer-container" id="viewerContainer">
          <img id="itemImg" src="" alt="불상 대표 이미지" class="viewer-img">
          <!-- 핫스팟 핀은 JS에 의해 동적 추가됩니다 -->
        </div>
        <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin-top:0.5rem;">
          * 이미지 위 번호 핀을 클릭하시면 세부 특징을 확인하실 수 있습니다.
        </p>
      </div>

      <!-- 상세 정보 영역 -->
      <div class="detail-info">
        <span id="itemTag" class="card-tag"></span>
        <h2 id="itemName" style="font-size: 2rem; margin-bottom: 0.5rem;"></h2>
        <p id="itemSummary" style="color: var(--gold-light); font-size: 1.05rem; margin-bottom: 1rem;"></p>

        <table class="meta-table">
          <tr>
            <th>시대</th>
            <td id="itemPeriod"></td>
          </tr>
          <tr>
            <th>소장처</th>
            <td id="itemLocation"></td>
          </tr>
          <tr>
            <th>출처 정보</th>
            <td><a id="itemSource" href="#" target="_blank" style="text-decoration: underline;"></a></td>
          </tr>
        </table>

        <div style="margin-bottom: 1.5rem;">
          <h4 style="margin-bottom: 0.5rem; color:#fff;">상세 설명</h4>
          <p id="itemDesc" style="color: var(--text-muted); font-size:0.95rem; word-break: keep-all;"></p>
        </div>

        <div>
          <h4 style="margin-bottom: 0.5rem; color:#fff;">관전 포인트 3가지</h4>
          <ul id="itemPoints" class="point-list"></ul>
        </div>
      </div>
    </div>

    <!-- 하단 이동 네비게이션 -->
    <div class="nav-buttons">
      <a id="prevBtn" href="#" class="btn-gold">← 이전 전시품</a>
      <a id="nextBtn" href="#" class="btn-gold">다음 전시품 →</a>
    </div>
  </main>

  <!-- 핫스팟 세부정보 모달 -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle" style="margin-bottom: 1rem;"></h3>
      <p id="modalBody" style="color: var(--text-muted); font-size: 0.95rem;"></p>
    </div>
  </div>

  <footer>
    <p>팀명: 디지털 헤리티지 큐레이터 A팀 | 작성자: 양인서 | 제작연도: 2026</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // 상세페이지 초기화 실행
    window.addEventListener('DOMContentLoaded', renderDetailPage);
  </script>
</body>
</html>
